[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-optimizer"
version = "0.1.0"
description = "Token-efficient RAG layer for agentic dev tasks (jira/bug/analysis/coding/design/response)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "sentence-transformers>=2.7.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "click>=8.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
optimize = "token_optimizer.cli:cli"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["token_optimizer*", "eval*"]
